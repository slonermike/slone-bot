name: Close external pull requests

# Outside PRs are not accepted for now (see CONTRIBUTING.md).
# SECURITY: pull_request_target runs with write access, so this workflow NEVER checks out, builds,
# or runs PR code. It only calls the GitHub API to label, comment, and close. Nothing else is granted.
on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  pull-requests: write
  issues: write

jobs:
  close:
    if: ${{ !contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const number = context.payload.pull_request.number;
            try {
              await github.rest.issues.createLabel({ owner, repo, name: 'external-pr', color: 'cfd3d7', description: 'Pull request from outside the project' });
            } catch (e) { /* label already exists */ }
            await github.rest.issues.addLabels({ owner, repo, issue_number: number, labels: ['external-pr'] });
            await github.rest.issues.createComment({
              owner, repo, issue_number: number,
              body: [
                'Thanks for taking the time to look at this project!',
                '',
                'minigame-bot is a small experiment and is **not accepting outside pull requests right now**, so this PR is being closed automatically. This is a temporary stance, not a judgment of your change. Forking and reusing the code under the MIT license is very welcome.',
                '',
                'If you have an idea, please describe it in an issue instead (if issues are enabled). We tally what people try to decide how to open contributions later.',
              ].join('\n'),
            });
            await github.rest.pulls.update({ owner, repo, pull_number: number, state: 'closed' });
